[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-command-runner"
version = "0.1.0"
description = "A simple standalone local command runner"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
forge = "forge:main"

[tool.setuptools]
py-modules = ["forge"]
